<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Παιχνίδια Φυσικής 2010</title>
<style>
:root{--blue:#0000ff;--bg:#ffff80;--out:#e8e8a0;--line:#d8d830;--ok:#008000;--bad:#d00000;--ink:#000}
*{box-sizing:border-box}
body{margin:0;background:var(--out);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
#app{max-width:860px;min-height:100vh;margin:0 auto;background:var(--bg);border:2px solid var(--blue);display:flex;flex-direction:column}
header{background:var(--blue);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header b{font-size:20px;display:block}header small{font-size:13px}
.hr{display:flex;align-items:center;gap:12px;font-size:15px}
#tm{background:#fff;color:var(--blue);font:bold 18px "Courier New",monospace;letter-spacing:2px;padding:6px 14px;min-width:92px;text-align:center}
#tm.low{color:#f00}
main{flex:1;padding:24px 20px}
h1{margin:0 0 14px;font-size:30px}
.sub{font-size:14px;color:#444;margin-bottom:8px}
.q{font:bold 20px/1.35 "Times New Roman",serif;margin:0 0 16px}
.body{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.opts{flex:1 1 300px;font:18px/1.4 "Times New Roman",serif}
.opts label{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;margin-bottom:4px;cursor:pointer;border-radius:4px}
.opts input{margin-top:6px}
.opts.lock label{cursor:default}
.g{background:rgba(0,160,0,.22);outline:1px solid var(--ok)}
.b{background:rgba(220,0,0,.2);outline:1px solid var(--bad)}
.fig{flex:0 1 340px;max-width:100%}.fig img{display:block;max-width:100%;height:auto;border:1px solid #888}
.box{background:#fff;border:1px solid var(--line);padding:16px;line-height:1.6;font-size:17px}
table{border-collapse:collapse;width:100%}
.mt td,.mt th{padding:5px 6px;font:17px "Times New Roman",serif}
.mt .l{border:1px solid #888;background:#fff;width:60%}
.mt th{font:bold 14px Arial;text-align:center}.mt td.c{text-align:center}
.mt td.c.g,.mt td.c.b{outline-offset:-2px}
.rt{background:#fff;border:1px solid var(--line);margin-top:16px}
.rt td,.rt th{border:1px solid var(--line);padding:6px 8px;font-size:14px;text-align:left}
.rt tr.rv{cursor:pointer}.rt tr.rv:hover{background:#ffffc0}
.map{position:relative;display:inline-block;cursor:crosshair;line-height:0}
.map i{position:absolute;display:block;pointer-events:none}
.dot{width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:rgba(255,0,0,.8);border:2px solid #fff}
.zone{border:3px solid var(--ok);background:rgba(0,160,0,.15)}
.res{font:bold 18px "Times New Roman",serif;margin-top:14px}.res.ok{color:var(--ok)}.res.no{color:var(--bad)}
.cor{margin-top:12px;font:16px/1.5 "Times New Roman",serif;color:#063}
footer{border-top:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
footer div{display:flex;gap:8px;flex-wrap:wrap}
button{font:bold 15px Arial;padding:10px 16px;border-radius:6px;cursor:pointer;border:1px solid var(--blue);background:#fff;color:var(--blue)}
button.p{background:var(--blue);color:#fff}button.f{background:var(--ok);color:#fff;border-color:var(--ok)}
button:disabled{background:#999;color:#eee;border-color:#999;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #f80;outline-offset:2px}
.big{font:bold 34px Arial;color:var(--blue)}
</style>
</head>
<body>
<div id="app">
<header><div><b>Παιχνίδια Φυσικής 2010</b><small>Συγγραφέας: Μουρούζης Παναγιώτης</small></div>
<div class="hr"><span id="pg"></span><span id="tm">20:00</span></div></header>
<main id="main"></main>
<footer id="foot"></footer>
</div>

{t:"c",q:"Ποιες από τις παρακάτω προτάσεις που αφορούν τις διαφορές του DNA από το RNA είναι σωστές;",o:["Το DNA είναι δίκλωνο μόριο ενώ το RNA είναι μονόκλωνο","Το DNA είναι νουκλεϊκό οξύ ενώ το RNA είναι αμινοξύ","Το DNA βρίσκεται στον πυρήνα του κυττάρου ενώ το RNA μπορεί να μετακινείται και να βρίσκεται είτε στον πυρήνα είτε στο κυτταρόπλασμα","Το DNA περιέχει 4 είδη αζωτούχων βάσεων ενώ το RNA μόνο 3","Το DNA περιπλέκεται σε δομές που λέγονται χρωμοσώματα ενώ το RNA όχι"],c:[0,2,4],i:1},

{t:"r",q:"Δύο όμοια λαμπάκια είναι συνδεδεμένα παράλληλα με ηλεκτρική πηγή σταθερής τάσης και φωτοβολούν. Αν αφαιρέσουμε το ένα από τα δύο λαμπάκια το άλλο που θα μείνει συνδεδεμένο θα:",o:["σβήσει","συνεχίζει να φωτοβολεί όπως πριν","φωτοβολεί εντονώτερα από πριν","φωτοβολεί ασθενέστερα απο πριν"],c:[1],i:3},
{t:"c",q:"Αν μπορούσαμε να κάνουμε ένα ταξίδι στη Σελήνη τότε ποια από τα παρακάτω φαινόμενα θα μπορούσαμε να παρατηρήσουμε:",o:["θα βλέπαμε τον ουρανό μαύρο και με αστέρια ακόμη και την ημέρα","αν θα ρίχναμε μία πέτρα και ένα κομμάτι χαρτί από το ίδιο ύψος θα έπεφταν ταυτόχρονα στο έδαφος","αν ρίχναμε με το χέρι μας με δύναμη μία πέτρα προς τα πάνω αυτή θα έφευγε στο διάστημα","θα σηκώναμε μία πέτρα με πολύ μεγαλύτερη ευκολία απ'ότι στη Γη","αν κλωτσάγαμε οριζόντια μια μπάλλα ποδοσφαίρου δε θα νιώθαμε σχεδόν καμία αντίσταση στο πόδι μας"],c:[0,1,3],i:4},
{t:"m",q:"Να αντιστοιχίσετε το φυσικό μέγεθος (αριστερή στήλη) με το κατάλληλο όργανο με το οποίο γίνεται η μέτρηση του (δεξιά στήλη)",L:["ένταση ηλεκτρικού ρεύματος","ηλεκτρική τάση","πίεση","μάζα","βάρος"],R:["δυναμόμετρο","αμπερόμετρο","ζυγαριά","βολτόμετρο","μανόμετρο"],c:[1,3,4,2,0]},
{t:"r",q:"Με τον όρο \"μεταλλαγμένα προϊόντα\" εννοούμε τρόφιμα προερχόμενα από φυτά τα οποία:",o:["έχουν δεχτεί μεγάλη ποσότητα φυτοφαρμάκων","έχουν καλλιεργηθεί με βιολογικές μεθόδους","έχουν τεχνητά τροποποιημένο γενετικό υλικό","έχουν αναπτυχθεί σε περιβάλλον θερμοκηπίου"],c:[2]},
{t:"r",q:"Ένα υλικό έχει τις εξής ιδιότητες: Είναι στερεό, είναι αγωγός του ηλεκτρισμού, αντιδρά με τα οξέα απελευθερώνοντας υδρογόνο. Ποιο υλικό από τα παρακάτω μπορεί να είναι;",o:["άνθρακας","χαλκός","υδράργυρος","σίδηρος"],c:[3]},
{t:"r",q:"Σ'ενα αντικείμενο ασκούνται δύο δυνάμεις με μέτρο F1=3N η πρώτη και F2=4N η δεύτερη. Δεν γνωρίζουμε την κατεύθυνση των δυνάμεων. Ξέρουμε όμως ότι η συνισταμένη τους είναι Fολ=5Ν. Επομένως οι δύο αυτές δυνάμεις:",o:["έχουν την ίδια κατεύθυνση","έχουν αντίθετη κατεύθυνση","είναι κάθετες η μία ως προς την άλλη","σχηματίζουν μία τυχαία γωνία που δεν μπορούμε να προσδιορίσουμε"],c:[2],i:5},
{t:"c",q:"Στο διπλανό σχήμα φαίνεται ένα απλό κύκλωμα με μπαταρία, αγωγούς (καλώδια), λαμπάκι και ποτήρι που περιέχει κάποιο καθαρό υγρό ή υγρό διάλυμα. Το λαμπάκι θα ανάψει αν το ποτήρι περιέχει:",o:["αλατόνερο","απιονισμένο νερό","λάδι","ζαχαρόνερο","ασβεστόνερο","ξύδι"],c:[0,4,5],i:6},
{t:"r",q:"Σε ποτήρι που περιέχει διάλυμα υδροχλωρικού οξέος (HCl) με pH=3 ρίχνουμε με τη βοήθεια προχοΐδας συνεχώς πυκνό διάλυμα υδροξειδίου του νατρίου (NaOH). Πως θα μεταβληθεί το pH του διαλύματος;",o:["θα παραμείνει σταθερό","θα ελαττώνεται σιγά σιγά","θα αυξάνεται σιγά σιγά αλλά δε θα ξεπεράσει το 7","θα αυξάνεται σιγά σιγά και θα ξεπεράσει το 7"],c:[3],i:7},
{t:"r",q:"Για την υπερθέρμανση του πλανήτη και το λιώσιμο των πάγων υπεύθυνα είναι",o:["τα μεγάλα εργοστάσια που χρησιμοποιούν ορυκτά καύσιμα (πετρέλαιο, γαιάνθρακες ή φυσικό αέριο)","οι κεντρικές θερμάνσεις των κτιρίων που καίνε πετρέλαιο","τα μέσα μεταφοράς που καταναλώνουν βενζίνη ή πετρέλαιο","όλα τα παραπάνω"],c:[3],i:8},
{t:"c",q:"Σ΄ένα φανταστικό κόσμο χωρίς τριβή ποια απο τα παρακάτω φαινόμενα δε θα μπορούσαν να συμβούν:",o:["περπάτημα","κίνηση αυτοκινήτου","πέταγμα αεροπλάνου","πέταγμα μιας πέτρας προς τα πάνω"],c:[0,1],i:9},
{t:"r",q:"Στο διπλανό σχήμα φαίνονται δύο ηλεκτρικά φορτισμένες σφαίρες σε απόσταση (α) που απωθούνται με δύναμη F. Αν τις απομακρύνουμε σε απόσταση (2α), όπως φαίνεται στο δεύτερο σχήμα, απωθούνται με δύναμη F/4, δηλαδή 4 φορές μικρότερη. Αν τώρα τις απομακρύνουμε σε απόσταση (3α) η απωστική δύναμη θα γίνει:",o:["F/3 (τρεις φορές μικρότερη από την αρχική)","F/6 (έξι φορές μικρότερη από την αρχική)","F/9 (εννιά φορές μικρότερη από την αρχική)","F/12 (δώδεκα φορές μικρότερη από την αρχική)"],c:[2],i:10},
{t:"h",q:"Στον παρακάτω Ευρωπαϊκό χάρτη εντοπίστε την οροσειρά των Άλπεων",i:11,hs:[9,14,16,17]},
{t:"r",q:"Στο διάγραμμα του διπλανού σχήματος φαίνεται η μεταβολή της τιμής του ρεύματος (Ι) σε σχέση με την τάση (V) που εφαρμόζεται στα άκρα ενός διπόλου. Επομένως αυτό το δίπολο έχει ωμική αντίστασηι:",o:["0,2Ω","2Ω","20Ω","200Ω"],c:[0],i:12},
{t:"r",q:"Ένα αυτοκίνητο μετρήθηκε ότι τρέχει με 30 m/s (μέτρα ανά δευτερόλεπτο) σε δρόμο όπου το όριο ταχύτητας είναι 100 km/h (χιλιόμετρα ανά ώρα). Κατά τη γνώμη σας το αυτοκίνητο:",o:["έχει υπερβεί το όριο ταχύτητας","δεν έχει υπερβεί το όριο ταχύτητας","κινείται ακριβώς στο όριο ταχύτητας","δεν μπορούμε να συγκρίνουμε τις δύο ταχύτητες"],c:[0]},
{t:"m",q:"Να αντιστοιχίσετε το είδος του ιστού της αριστερής στήλης με το όργανο της δεξιάς στήλης:",L:["επιθηλιακός ιστός","ερειστικός ιστός","μυικός ιστός","νευρικός ιστός"],R:["εγκέφαλος","καρδιά","δέρμα","μετωπιαίο οστό"],c:[2,3,1,0]},
{t:"c",q:"Ποιες από τις παρακάτω είναι ιδιότητες του διοξειδίου του άνθρακα (CO2);",o:["Είναι αέριο άχρωμο και άοσμο","Δεν συντηρεί την καύση (σβήνει τη φωτιά)","Είναι τοξικό για τον ανθρώπινο οργανισμό ακόμη και σε μικρές ποσότητες","Υπάρχει στην ατμόσφαιρα σε ποσοστό λιγότερο του 1%","Είναι σε μεγάλο ποσοστό υπεύθυνο για το φαινόμενο του θερμοκηπίου","Παράγεται κατά την καύση των υδρογονανθράκων (π.χ. βενζίνη)"],c:[0,1,3,4,5]},
{t:"m",q:"Κάντε την αντιστοίχιση ανάμεσα στις παρακάτω ηλεκτροπαραγωγικές εγκαταστάσεις της πρώτης στήλης και τη μορφή ενέργειας που αξιοποιούν για την παραγωγή ηλεκτρισμού της δεύτερης στήλης",L:["Φωτοβολταϊκό πάρκο","Εργοστάσιο καύσης λιγνίτη","Υδροηλεκτρικό εργοστάσιο","Αιολικό πάρκο"],R:["Δυναμική","Κινητική","Ηλιακή","Χημική"],c:[2,3,0,1],i:13}
];
var QN=Q.length,LET="ABCDEFGH";
var ans,sub,ok,cur,left,tmH,mode,$=function(i){return document.getElementById(i)};

function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),r=s%60;return(m<10?"0":"")+m+":"+(r<10?"0":"")+r}
function setTimer(){var e=$("tm");e.textContent=mode=="rev"?"":fmt(left);e.style.visibility=mode=="rev"?"hidden":"visible";e.className=(mode=="q"&&left<=60)?"low":""}
function has(i){var m=Q[i],a=ans[i];if(m.t=="r")return a!=null;if(m.t=="c")return a&&a.some(Boolean);if(m.t=="h")return !!a;
 for(var r=0;r<m.L.length;r++)if(a[r]==null)return false;return true}
function check(i){var m=Q[i],a=ans[i],k;
 if(m.t=="r")return a==m.c[0];
 if(m.t=="c"){for(k=0;k<m.o.length;k++)if(!!a[k]!==(m.c.indexOf(k)>=0))return false;return true}
 if(m.t=="m"){for(k=0;k<m.L.length;k++)if(a[k]!==m.c[k])return false;return true}
 return a.col>=m.hs[0]&&a.col<=m.hs[1]&&a.row>=m.hs[2]&&a.row<=m.hs[3]}
function answered(){return sub.filter(Boolean).length}
function rowEdge(r){return r<=16?r*9/240:(144+(r-16)*96/11)/240}

function start0(){clearInterval(tmH);mode="intro";ans=[];sub=[];ok=[];for(var i=0;i<QN;i++){ans.push(Q[i].t=="c"?[]:Q[i].t=="m"?[]:null);sub.push(false);ok.push(false)}
 left=TIME;cur=0;$("pg").textContent="";setTimer();
 $("main").innerHTML='<h1>Παιχνίδια Φυσικής 2010</h1><div class="box">1) Η διάρκεια του τεστ είναι 20 λεπτά<br>2) Για να καταχωρηθεί μια απάντηση πρέπει να πατήσετε το κουμπί "καταχώρηση" .<br>3) Μπορείτε να αφήσετε κάποια ερώτηση και να προχωρήσετε στην επόμενη. Η ερώτηση αυτή θα εμφανιστεί ξανά<br>4) Υπάρχουν ερωτήσεις με μία σωστή απάντηση (κυκλάκι) και ερωτήσεις με πολλές σωστές απαντήσεις (τετραγωνάκι)<br><br>ΚΑΛΗ ΕΠΙΤΥΧΙΑ!!!</div>';
 $("foot").innerHTML='<span></span><button class="p" id="bs">Έναρξη...</button>';$("bs").onclick=begin;$("bs").focus()}
function begin(){mode="q";left=TIME;clearInterval(tmH);tmH=setInterval(tick,1000);show(0)}
function tick(){left--;setTimer();if(left<=0){clearInterval(tmH);alert(T.tmo);results()}}

function show(i){cur=i;var m=Q[i],a=ans[i],s=sub[i],lock=s||mode=="rev",h="";
 $("pg").textContent="Ερώτηση "+(i+1)+" / "+QN;setTimer();
 h+='<div class="sub">Ερώτηση '+(i+1)+' · '+PT+' βαθμός'+(s?' · απαντήθηκε':'')+'</div><p class="q">'+m.q+'</p><div class="body">';
 if(m.t=="r"||m.t=="c"){h+='<div class="opts'+(lock?' lock':'')+'">';
  m.o.forEach(function(t,k){var on=m.t=="r"?a===k:!!a[k],cls="";
   if(s){if(m.c.indexOf(k)>=0)cls="g";else if(on)cls="b"}
   h+='<label class="'+cls+'"><input type="'+(m.t=="r"?"radio":"checkbox")+'" name="o" data-k="'+k+'"'+(on?' checked':'')+(lock?' disabled':'')+'><span>'+t+'</span></label>'});
  h+='</div>'}
 if(m.t=="m"){h+='<div class="opts" style="flex-basis:100%"><table class="mt"><tr><th style="text-align:left">Αριστερή στήλη</th>';
  m.R.forEach(function(_,k){h+='<th>'+LET[k]+'</th>'});h+='</tr>';
  m.L.forEach(function(t,r){h+='<tr><td class="l">'+t+'</td>';
   m.R.forEach(function(_,k){var cls="";if(s){if(m.c[r]==k)cls="g";else if(a[r]==k)cls="b"}
    h+='<td class="c '+cls+'"><input type="radio" name="m'+r+'" data-r="'+r+'" data-k="'+k+'"'+(a[r]===k?' checked':'')+(lock?' disabled':'')+'></td>'});h+='</tr>'});
  h+='</table><div class="sub" style="margin-top:12px">Δεξιά στήλη</div><div class="box" style="font:18px/1.4 Times New Roman,serif">'+m.R.map(function(t,k){return LET[k]+'.&nbsp; '+t}).join('<br>')+'</div>';
  if(s&&!ok[i])h+='<div class="cor">Σωστές αντιστοιχίσεις: '+m.L.map(function(t,r){return t+' → '+m.R[m.c[r]]}).join(' · ')+'</div>';
  h+='</div>'}
 if(m.t=="h"){h+='<div><div class="map" id="map"><img src="'+IM[m.i]+'" alt="Χάρτης Ευρώπης" style="max-width:100%;height:auto">'+(a?'<i class="dot" style="left:'+a.fx*100+'%;top:'+a.fy*100+'%"></i>':'')+
  (s?'<i class="zone" style="left:'+m.hs[0]/31*100+'%;width:'+(m.hs[1]+1-m.hs[0])/31*100+'%;top:'+rowEdge(m.hs[2])*100+'%;height:'+(rowEdge(m.hs[3]+1)-rowEdge(m.hs[2]))*100+'%"></i>':'')+'</div>'+
  '<p class="sub">Κάντε κλικ πάνω στην εικόνα και μετά πατήστε «Καταχώρηση».</p></div>'}
 else if(m.i!=null)h+='<div class="fig"><img src="'+IM[m.i]+'" alt=""></div>';
 h+='</div>';
 if(s)h+='<div class="res '+(ok[i]?'ok':'no')+'">'+(ok[i]?'Σωστό !!':'Λάθος')+'</div>';
 $("main").innerHTML=h;
 $("main").querySelectorAll("input").forEach(function(e){e.onchange=function(){pick(e)}});
 if(m.t=="h"&&!lock)$("map").onclick=mapClick;
 foot()}
function foot(){var f=$("foot");
 if(mode=="rev"){f.innerHTML='<button id="bp">◀ Προηγούμενη</button><button id="br">Αποτελέσματα</button><button id="bn">Επόμενη ▶</button>';
  $("bp").onclick=function(){show((cur+QN-1)%QN)};$("bn").onclick=function(){show((cur+1)%QN)};$("br").onclick=results;return}
 f.innerHTML='<div><button id="bp">◀ Προηγούμενη</button><button id="bn">Επόμενη ▶</button></div><div><button id="bk">Καταχώρηση</button><button class="f" id="bf">Τέλος</button></div>';
 $("bp").onclick=function(){show((cur+QN-1)%QN)};$("bn").onclick=function(){show((cur+1)%QN)};$("bf").onclick=finish;$("bk").onclick=submit;upd()}
function upd(){var b=$("bk");if(b)b.disabled=!(mode=="q"&&!sub[cur]&&has(cur))}
function pick(e){var m=Q[cur],k=+e.dataset.k;
 if(m.t=="r")ans[cur]=k;else if(m.t=="c")ans[cur][k]=e.checked;else ans[cur][+e.dataset.r]=k;upd()}
function mapClick(ev){if(sub[cur]||mode!="q")return;var r=$("map").getBoundingClientRect(),fx=(ev.clientX-r.left)/r.width,fy=(ev.clientY-r.top)/r.height,row=0;
 while(row<26&&fy>=rowEdge(row+1))row++;
 ans[cur]={fx:fx,fy:fy,col:Math.min(30,Math.floor(fx*31)),row:row};show(cur)}
function submit(){if(mode!="q"||sub[cur]||!has(cur))return;sub[cur]=true;ok[cur]=check(cur);show(cur)}
function finish(){if(mode!="q")return;var n=QN-answered();if(confirm(n>0?T.f1a+n+T.f1b:T.f2))results()}

function results(){clearInterval(tmH);mode="res";var sc=0,i,h="";for(i=0;i<QN;i++)if(ok[i])sc+=PT;
 var tot=QN*PT,pct=sc/tot*100,pass=pct>=RATE;setTimer();$("tm").style.visibility="visible";$("tm").textContent="";$("pg").textContent="Αποτελέσματα";
 h+='<div class="box"><div class="big">'+sc+' από '+tot+' <span style="font-size:20px">('+Math.round(pct)+'%)</span></div><div style="margin-top:6px">Βαθμολογία: '+sc+' · Βάση: '+RATE+'% · Αποτέλεσμα: '+(pass?'Επιτυχία':'Αποτυχία')+'</div>'+
  '<div style="color:'+(pass?'#080':'#c00')+'">'+(pass?'Congratulations, you passed.':'You did not pass.')+'</div><br><b>Ευχαριστούμε για τη συμμετοχή!</b></div>'+
  '<table class="rt"><tr><th>#</th><th>Ερώτηση</th><th>Βαθμός</th></tr>';
 for(i=0;i<QN;i++)h+='<tr class="rv" data-i="'+i+'" tabindex="0"><td>'+(i+1)+'</td><td>'+Q[i].q+(sub[i]?'':' (αναπάντητη)')+'</td><td style="white-space:nowrap;font-weight:bold;color:'+(ok[i]?'#080':'#c00')+'">'+(ok[i]?PT:0)+' / '+PT+'</td></tr>';
 $("main").innerHTML=h+'</table>';
 $("main").querySelectorAll(".rv").forEach(function(r){var go=function(){mode="rev";show(+r.dataset.i)};r.onclick=go;r.onkeydown=function(e){if(e.key=="Enter")go()}});
 $("foot").innerHTML='<span></span><button class="p" id="br">Δοκιμάστε ξανά</button>';$("br").onclick=start0;window.scrollTo(0,0)}
start0();
</script>
</body>
</html>
